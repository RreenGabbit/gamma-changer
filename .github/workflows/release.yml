name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Checksum
        shell: pwsh
        run: |
          Copy-Item build/Release/GammaChanger.exe GammaChanger.exe
          $hash = (Get-FileHash GammaChanger.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  GammaChanger.exe" | Out-File -Encoding ascii -NoNewline SHA256SUMS.txt

      # A release created by hand for the same tag is left untouched.
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release ${{ github.ref_name }} already exists; skipping."
            exit 0
          }
          gh release create "${{ github.ref_name }}" GammaChanger.exe SHA256SUMS.txt `
            --title "Gamma Changer ${{ github.ref_name }}" --generate-notes
